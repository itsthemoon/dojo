<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Classroom Management System</h1>
        </header>
        <main id="mainContent">
            <div id="classSelection">
                <h2>Select Your Class</h2>
                <p>Choose from existing classes or create a new one:</p>

                <div class="class-selection-container">
                    <div class="selection-option">
                        <h3>Join as Student</h3>
                        <p>Select a class to view as a student (no password required):</p>
                        <select id="studentClassSelect">
                            <option value="">Loading classes...</option>
                        </select>
                        <button id="joinAsStudent" class="button">Join as Student</button>
                    </div>

                    <div class="divider">
                        <span>OR</span>
                    </div>

                    <div class="selection-option">
                        <h3>Join as Teacher</h3>
                        <p>Select your class and enter the class password:</p>
                        <select id="teacherClassSelect">
                            <option value="">Loading classes...</option>
                        </select>
                        <input type="password" id="classPassword" placeholder="Class Password" />
                        <button id="joinAsTeacher" class="button">Join as Teacher</button>
                    </div>

                    <div class="divider">
                        <span>OR</span>
                    </div>

                    <div class="selection-option">
                        <h3>Create New Class</h3>
                        <button id="createClassBtn" class="button secondary">Create New Class</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Create Class Modal -->
    <div id="createClassModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Class</h2>
                <span class="close-button" id="closeCreateModal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="adminPassword">Admin Password:</label>
                    <input type="password" id="adminPassword" placeholder="Enter admin password" required />
                </div>
                <div class="form-group">
                    <label for="teacherName">Teacher Name:</label>
                    <input type="text" id="teacherName" placeholder="Enter teacher name" required />
                </div>
                <div class="form-group">
                    <label for="teacherEmoji">Teacher Emoji:</label>
                    <select id="teacherEmoji" required>
                        <option value="👩‍🏫">👩‍🏫 Teacher (Woman)</option>
                        <option value="👨‍🏫">👨‍🏫 Teacher (Man)</option>
                        <option value="👩‍💼">👩‍💼 Professional (Woman)</option>
                        <option value="👨‍💼">👨‍💼 Professional (Man)</option>
                        <option value="👩‍🎓">👩‍🎓 Graduate (Woman)</option>
                        <option value="👨‍🎓">👨‍🎓 Graduate (Man)</option>
                        <option value="👩">👩 Woman</option>
                        <option value="👨">👨 Man</option>
                        <option value="👩‍🔬">👩‍🔬 Scientist (Woman)</option>
                        <option value="👨‍🔬">👨‍🔬 Scientist (Man)</option>
                        <option value="👩‍💻">👩‍💻 Technologist (Woman)</option>
                        <option value="👨‍💻">👨‍💻 Technologist (Man)</option>
                        <option value="👩‍🎨">👩‍🎨 Artist (Woman)</option>
                        <option value="👨‍🎨">👨‍🎨 Artist (Man)</option>
                        <option value="🧑‍🏫">🧑‍🏫 Teacher (Non-binary)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="className">Class Name:</label>
                    <input type="text" id="className" placeholder="Enter class name" required />
                </div>
                <div class="form-group">
                    <label for="newClassPassword">Class Password:</label>
                    <input type="password" id="newClassPassword" placeholder="Create a password for this class" required />
                </div>
            </div>
            <div class="modal-footer">
                <button id="submitCreateClass" class="button">Create Class</button>
                <button id="cancelCreateClass" class="button secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="bundle.js"></script>
</body>
</html>
